<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triage Enfermería | Belén OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Fondo Fluido Animado */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        
        /* Efecto Cristal */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden relative">

    <!-- Fondos en movimiento -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0 fixed">
        <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-cyan-200/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[35rem] h-[35rem] bg-teal-200/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob animation-delay-2000"></div>
    </div>

    <!-- Topbar -->
    <header class="h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-cyan-100 hover:text-cyan-700 flex items-center justify-center transition text-slate-600">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 class="font-bold tracking-wide text-slate-800"><i class="fas fa-heartbeat text-cyan-600 mr-2"></i>Triage y Registro</h2>
        </div>
        <span class="text-sm font-bold text-slate-500 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200">Enfermería Activa</span>
    </header>

    <main class="flex-1 overflow-y-auto custom-scrollbar p-6 relative z-10">
        <div class="max-w-3xl mx-auto space-y-6">

            <!-- Buscador Inteligente -->
            <div class="glass-panel p-6 rounded-2xl shadow-sm relative">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fas fa-search text-cyan-600"></i> 1. Buscar o Registrar Paciente
                </h3>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" id="buscador-paciente" placeholder="Buscar paciente (Ej. Laura) o teclee para nuevo..." 
                           class="w-full pl-11 pr-4 py-3 bg-white/50 backdrop-blur-sm border border-slate-200 rounded-xl text-lg font-medium focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 transition shadow-inner">
                    <div id="resultados-busqueda" class="hidden absolute w-full mt-2 bg-white/95 backdrop-blur-md border border-slate-200 rounded-xl shadow-xl z-50 overflow-hidden">
                        <!-- Llenado por JS -->
                    </div>
                </div>
            </div>

            <!-- Ficha de Identificación -->
            <div class="glass-panel p-6 rounded-2xl shadow-sm" id="panel-datos">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">
                        <i class="fas fa-id-card text-cyan-600 mr-2"></i> 2. Ficha de Identificación
                    </h3>
                    <span id="badge-paciente" class="hidden bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full border border-emerald-200 uppercase tracking-wide shadow-sm">
                        Expediente Encontrado
                    </span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Completo</label>
                        <input type="text" id="input-nombre" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Edad</label>
                        <input type="number" id="input-edad" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 focus:border-cyan-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Antecedentes Previos</label>
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center gap-2 cursor-pointer bg-white/50 px-4 py-2 rounded-lg border border-slate-200 hover:bg-white transition shadow-sm">
                            <input type="checkbox" id="chk-diabetes" class="w-4 h-4 text-cyan-600 rounded"> <span class="text-sm font-semibold text-slate-700">Diabetes</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer bg-white/50 px-4 py-2 rounded-lg border border-slate-200 hover:bg-white transition shadow-sm">
                            <input type="checkbox" id="chk-hta" class="w-4 h-4 text-cyan-600 rounded"> <span class="text-sm font-semibold text-slate-700">Hipertensión</span>
                        </label>
                        <div class="flex-1 min-w-[200px]">
                            <input type="text" id="input-alergias" placeholder="Alergias (Ej. Penicilina)" class="w-full bg-white/50 border border-slate-200 rounded-lg p-2 focus:border-cyan-500 outline-none text-sm text-red-600 font-medium shadow-sm">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Signos Vitales -->
            <div class="glass-panel p-6 rounded-2xl shadow-sm">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4">
                    <i class="fas fa-file-medical-alt text-cyan-600 mr-2"></i> 3. Captura Actual
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tensión Art. (TA)</label>
                        <input type="text" placeholder="120/80" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 text-center font-bold text-slate-700 focus:border-cyan-500 outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Frec. Card. (FC)</label>
                        <input type="number" placeholder="lpm" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 text-center font-bold text-slate-700 focus:border-cyan-500 outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Temp. (°C)</label>
                        <input type="number" step="0.1" placeholder="36.5" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 text-center font-bold text-slate-700 focus:border-cyan-500 outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Oxígeno (SpO2)</label>
                        <input type="number" placeholder="%" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 text-center font-bold text-slate-700 focus:border-cyan-500 outline-none shadow-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Motivo de Consulta Breve</label>
                    <input type="text" placeholder="Ej. Dolor abdominal desde hace 2 horas" class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 focus:border-cyan-500 outline-none text-sm shadow-inner">
                </div>
            </div>

            <!-- Asignación -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 shadow-sm mb-10">
                <div class="w-full md:w-1/2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pasar a Consultorio de:</label>
                    <select class="w-full bg-white/50 border border-slate-200 rounded-lg p-3 focus:border-cyan-500 outline-none font-semibold text-slate-700 shadow-sm">
                        <option>Dr. Juan Pérez (Medicina General)</option>
                        <option>Dra. Carmen Vega (Medicina General)</option>
                        <option>Dr. Arturo Gómez (Traumatología)</option>
                        <option>Pendiente / Urgencias</option>
                    </select>
                </div>
                <div class="w-full md:w-auto pt-4 md:pt-0">
                    <button onclick="enviarAlMedico()" class="w-full bg-slate-900 text-white px-8 py-4 rounded-xl font-bold shadow-xl hover:bg-slate-800 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i> Enviar a Médico
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const basePacientes = [
            { id: 1, nombre: "Laura Méndez", edad: 34, diabetes: false, hta: false, alergias: "Penicilina" },
            { id: 2, nombre: "Carlos Ruiz", edad: 45, diabetes: true, hta: true, alergias: "" },
            { id: 3, nombre: "Carmen Villalobos", edad: 29, diabetes: false, hta: false, alergias: "Látex" }
        ];

        let temporizadorBuscador; 
        document.getElementById('buscador-paciente').addEventListener('input', function(e) {
            const texto = e.target.value.toLowerCase();
            const contenedorResultados = document.getElementById('resultados-busqueda');
            clearTimeout(temporizadorBuscador);
            if(texto.length < 2) {
                contenedorResultados.classList.add('hidden');
                limpiarFicha();
                return;
            }
            temporizadorBuscador = setTimeout(() => {
                const resultados = basePacientes.filter(p => p.nombre.toLowerCase().includes(texto));
                contenedorResultados.innerHTML = '';
                if(resultados.length > 0) {
                    resultados.forEach(p => {
                        contenedorResultados.innerHTML += `
                            <div onclick='seleccionarPaciente(${JSON.stringify(p)})' class="p-4 hover:bg-cyan-50 cursor-pointer border-b border-slate-100 flex justify-between items-center transition">
                                <div>
                                    <p class="font-bold text-slate-800">${p.nombre}</p>
                                    <p class="text-[10px] uppercase font-bold text-slate-400">Edad: ${p.edad} años</p>
                                </div>
                                <i class="fas fa-chevron-right text-cyan-600"></i>
                            </div>
                        `;
                    });
                    contenedorResultados.classList.remove('hidden');
                } else {
                    contenedorResultados.innerHTML = `
                        <div class="p-4 text-center bg-slate-50">
                            <p class="text-sm font-bold text-slate-600 mb-1">Paciente no encontrado</p>
                            <p class="text-xs text-slate-400">Continúe llenando la ficha abajo.</p>
                        </div>
                    `;
                    contenedorResultados.classList.remove('hidden');
                    limpiarFicha();
                    document.getElementById('input-nombre').value = e.target.value;
                }
            }, 300); 
        });

        function seleccionarPaciente(paciente) {
            document.getElementById('buscador-paciente').value = paciente.nombre;
            document.getElementById('resultados-busqueda').classList.add('hidden');
            document.getElementById('input-nombre').value = paciente.nombre;
            document.getElementById('input-edad').value = paciente.edad;
            document.getElementById('chk-diabetes').checked = paciente.diabetes;
            document.getElementById('chk-hta').checked = paciente.hta;
            document.getElementById('input-alergias').value = paciente.alergias;
            document.getElementById('badge-paciente').classList.remove('hidden');
        }

        function limpiarFicha() {
            document.getElementById('input-nombre').value = '';
            document.getElementById('input-edad').value = '';
            document.getElementById('chk-diabetes').checked = false;
            document.getElementById('chk-hta').checked = false;
            document.getElementById('input-alergias').value = '';
            document.getElementById('badge-paciente').classList.add('hidden');
        }

        function enviarAlMedico() {
            const nombre = document.getElementById('input-nombre').value;
            if(!nombre) return alert("Falta capturar el nombre del paciente.");
            alert(`✅ ${nombre} ha sido enviado a la Sala de Espera del Médico.`);
            document.getElementById('buscador-paciente').value = '';
            limpiarFicha();
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
