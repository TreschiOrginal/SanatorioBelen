<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belén OS | Dashboard Operativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.85);  border: 1px solid rgba(255, 255, 255, 0.6); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        @media screen { .zona-impresion { display: none !important; } }
        @page { size: letter; margin: 3.6cm 1.6cm 1.1cm 1.6cm; }
        @media print { body > *:not(#print-dashboard) { display: none !important; } #print-dashboard { display: block !important; width: 100%; background: white; color: black; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] overflow-hidden flex relative">

    <!-- Backdrop oscuro para el Drawer en móvil y tablet (< 1024px) -->
    <div id="sidebar-backdrop" onclick="AdminController.alternarSidebarMovil(false)" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 hidden lg:hidden transition-opacity print:hidden"></div>

    <!-- ================= SIDEBAR (Fija en escritorio >= 1024px, Drawer deslizable en celular/tablet) ================= -->
    <aside id="sidebar-principal" class="fixed lg:static inset-y-0 left-0 w-72 max-w-[84vw] lg:w-64 h-full bg-white lg:bg-white/90 border-r border-slate-200 flex flex-col shadow-2xl lg:shadow-sm z-50 lg:z-10 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out shrink-0 print:hidden">
        <div class="h-16 sm:h-20 flex items-center justify-between px-5 sm:px-6 border-b border-slate-200/70 shrink-0">
            <div class="flex items-center">
                <img src="assets/logo-belen.png" alt="Sanatorio Belén" class="w-9 h-9 object-contain mr-3" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-none">Belén OS</h1>
                    <p class="text-[9px] text-cyan-700 font-bold uppercase tracking-widest mt-1">Sanatorio Belén</p>
                </div>
            </div>
            <button type="button" onclick="AdminController.alternarSidebarMovil(false)" aria-label="Cerrar menú" class="lg:hidden w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <!-- Resumen de usuario visible dentro del drawer en móvil -->
        <div class="lg:hidden px-5 py-3 bg-slate-50 border-b border-slate-200/70 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-slate-800 text-white flex items-center justify-center shrink-0 text-xs">
                <i class="fas fa-user"></i>
            </div>
            <div class="min-w-0">
                <p class="text-xs font-extrabold text-slate-900 truncate" id="user-name-movil">Cargando...</p>
                <p class="text-[11px] text-slate-500 truncate" id="user-role-movil">Cargando...</p>
            </div>
        </div>

        <nav class="flex-1 px-3.5 py-4 sm:py-6 space-y-1.5 overflow-y-auto custom-scrollbar">
            <a href="?vista=central" data-vista="central" data-roles="admin,administrador,medico" data-modulo="ver_consultas" onclick="AdminController.navegar('central', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-chart-pie w-5 text-center"></i> Dashboard Central
            </a>

            <a href="?vista=fila" data-vista="fila" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano" data-modulo="ver_consultas" onclick="AdminController.navegar('fila', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-user-clock w-5 text-center"></i> Fila de Espera
            </a>

            <a href="?vista=hospitalizacion" data-vista="hospitalizacion" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_hospitalizados" onclick="AdminController.navegar('hospitalizacion', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-bed-pulse w-5 text-center"></i> Monitor de Camas
            </a>

            <a href="?vista=cirugias" data-vista="cirugias" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_quirofano" onclick="AdminController.navegar('cirugias', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-kit-medical w-5 text-center"></i> Cirugías
            </a>

            <a href="?vista=expedientes" data-vista="expedientes" data-roles="admin,medico" data-modulo="ver_consultas" onclick="AdminController.navegar('expedientes', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-folder-open w-5 text-center"></i> Búsqueda Histórica
            </a>

            <a href="?vista=personal" data-vista="personal" data-roles="admin" onclick="AdminController.navegar('personal', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-users-gear w-5 text-center"></i> Gestión de Personal
            </a>

            <a href="?vista=tarifario" data-vista="tarifario" data-roles="admin,administrador" title="El cobro muestra el total sin IVA. El 16% se suma en el desglose solo si el paciente solicita factura." onclick="AdminController.navegar('tarifario', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-file-invoice-dollar w-5 text-center"></i> Tarifario y Caja
            </a>

            <a href="?vista=farmacia" data-vista="farmacia" data-roles="admin,administrador" title="Inventario, cargo sin IVA y bitácora. En su sesión el movimiento queda a su nombre." onclick="AdminController.navegar('farmacia', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-pills w-5 text-center"></i> Farmacia e Inventario
            </a>
        </nav>

        <div class="p-4 border-t border-slate-200/70 shrink-0">
            <button onclick="AdminController.cerrarSesion()" class="flex items-center gap-3 w-full px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-semibold transition">
                <i class="fas fa-sign-out-alt w-5 text-center"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="flex-1 min-w-0 h-full overflow-y-auto custom-scrollbar flex flex-col z-10 relative">
        
        <!-- Topbar Dinámica y Responsiva -->
        <header class="min-h-[3.75rem] sm:h-20 glass-panel border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 px-3 sm:px-6 lg:px-8 py-2 sticky top-0 z-20 print:hidden">
            <div class="flex items-center gap-2.5 min-w-0">
                <button type="button" id="btn-abrir-sidebar" onclick="AdminController.alternarSidebarMovil()" aria-label="Abrir menú de navegación" class="lg:hidden w-10 h-10 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 flex items-center justify-center shadow-2xs shrink-0">
                    <i class="fas fa-bars text-base"></i>
                </button>
                <h2 class="text-base sm:text-xl font-extrabold text-slate-800 truncate" id="vista-titulo">Panel de Control</h2>
            </div>
            
            <div class="flex items-center flex-wrap gap-1.5 sm:gap-3">
                <div id="kiosco-operador" class="hidden"></div>
                <button type="button" id="kiosco-cerrar" onclick="AdminController.cerrarSesion()" class="hidden text-xs font-bold text-slate-500 hover:text-red-600 border border-slate-200 rounded-lg px-2.5 py-1.5 sm:px-3 sm:py-2"><i class="fas fa-power-off sm:mr-1"></i><span class="hidden sm:inline">Cerrar sesión del kiosco</span></button>
                <button type="button" id="btn-cache-documentos" onclick="BelenUI.abrirCacheAvancesYDocumentos()" class="text-xs font-extrabold text-emerald-900 bg-emerald-50 border-2 border-emerald-300 rounded-lg px-2.5 py-1.5 sm:px-3 sm:py-2 hover:bg-emerald-100 shadow-2xs flex items-center gap-1.5" title="Caché, Documentos y Avances"><i class="fas fa-cloud-arrow-down text-emerald-700"></i> <span class="hidden md:inline">📋 Caché / Documentos y Avances</span><span class="md:hidden">Caché</span></button>
                <button type="button" id="btn-mis-cedulas" onclick="BelenUI.abrirMisCedulas()" class="hidden text-xs font-bold text-cyan-800 bg-cyan-50 border border-cyan-200 rounded-lg px-2.5 py-1.5 sm:px-3 sm:py-2 hover:bg-cyan-100" title="Mis Cédulas de Firma"><i class="fas fa-id-card sm:mr-1"></i><span class="hidden sm:inline">Mis Cédulas de Firma</span><span class="sm:hidden">Cédulas</span></button>
                <div class="flex items-center gap-2.5 pl-2 sm:pl-4 border-l border-slate-200">
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-slate-800 leading-none" id="user-name">Cargando...</p>
                        <p class="text-xs text-slate-500 mt-1" id="user-role">Cargando...</p>
                    </div>
                    <button type="button" onclick="AdminController.alternarSidebarMovil()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-800 text-white flex items-center justify-center shadow-2xs" title="Menú y sesión">
                        <i class="fas fa-user text-xs sm:text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Contenedor donde se inyectan los módulos (Dashboard, Camas, etc.) -->
        <div id="admin-content" class="p-3 sm:p-5 lg:p-8 pb-24 lg:pb-8 flex-1 min-w-0">
            <!-- Aquí el JS dibuja el Dashboard Central -->
        </div>
    </main>

    <!-- ================= BARRA INFERIOR NATIVA PARA CELULAR / TABLET (< 1024px) ================= -->
    <nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-30 flex items-center justify-around px-1 py-1.5 shadow-[0_-4px_16px_rgba(15,23,42,0.06)] print:hidden">
        <a href="?vista=central" data-vista="central" data-roles="admin,administrador,medico" data-modulo="ver_consultas" onclick="AdminController.navegar('central', event)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-500 min-w-[54px]">
            <i class="fas fa-chart-pie text-sm mb-0.5"></i><span>Central</span>
        </a>
        <a href="?vista=fila" data-vista="fila" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano" data-modulo="ver_consultas" onclick="AdminController.navegar('fila', event)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-500 min-w-[54px]">
            <i class="fas fa-user-clock text-sm mb-0.5"></i><span>Fila</span>
        </a>
        <a href="?vista=hospitalizacion" data-vista="hospitalizacion" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_hospitalizados" onclick="AdminController.navegar('hospitalizacion', event)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-500 min-w-[54px]">
            <i class="fas fa-bed-pulse text-sm mb-0.5"></i><span>Camas</span>
        </a>
        <a href="?vista=cirugias" data-vista="cirugias" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_quirofano" onclick="AdminController.navegar('cirugias', event)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-500 min-w-[54px]">
            <i class="fas fa-kit-medical text-sm mb-0.5"></i><span>Cirugías</span>
        </a>
        <a href="?vista=tarifario" data-vista="tarifario" data-roles="admin,administrador" onclick="AdminController.navegar('tarifario', event)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-500 min-w-[54px]">
            <i class="fas fa-file-invoice-dollar text-sm mb-0.5"></i><span>Caja</span>
        </a>
        <button type="button" onclick="AdminController.alternarSidebarMovil(true)" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-[10px] font-bold text-slate-600 hover:text-cyan-700 min-w-[54px]">
            <i class="fas fa-bars text-sm mb-0.5"></i><span>Menú</span>
        </button>
    </nav>

    <!-- Scripts -->
    <div id="print-dashboard" class="zona-impresion"></div>
    <script src="js/belen-store.js?v=f28"></script>
    <script src="js/belen-ui.js?v=f28"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/admin-app.js?v=f28"></script>
</body>
</html>
