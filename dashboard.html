<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belén OS | Dashboard Operativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 10s infinite alternate ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.6); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex relative">

    <!-- Fondos en movimiento -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-cyan-200/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[35rem] h-[35rem] bg-teal-200/40 rounded-full mix-blend-multiply filter blur-[100px] animate-blob animation-delay-2000"></div>
    </div>

    <!-- ================= SIDEBAR (Navegación Dinámica) ================= -->
    <aside class="w-64 h-full glass-panel border-r border-slate-200 flex flex-col shadow-sm z-10">
        <div class="h-20 flex items-center px-6 border-b border-slate-200/50">
            <div class="w-8 h-8 rounded-lg bg-cyan-700 text-white flex items-center justify-center font-bold text-sm shadow-md mr-3">
                <i class="fas fa-staff-snake"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-none">Belén OS</h1>
                <p class="text-[9px] text-cyan-700 font-bold uppercase tracking-widest mt-1">Portal Interno</p>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <!-- NOTA EL ATRIBUTO "data-roles" EN CADA ENLACE; data-vista = vista que se dibuja en #admin-content -->
            <a href="?vista=central" data-vista="central" data-roles="admin,administrador,medico" data-modulo="ver_consultas" onclick="AdminController.navegar('central', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-chart-pie w-5"></i> Dashboard Central
            </a>

            <a href="?vista=fila" data-vista="fila" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano" data-modulo="ver_consultas" onclick="AdminController.navegar('fila', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-user-clock w-5"></i> Fila de Espera
            </a>

            <a href="?vista=hospitalizacion" data-vista="hospitalizacion" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_hospitalizados" onclick="AdminController.navegar('hospitalizacion', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-bed-pulse w-5"></i> Monitor de Camas
            </a>

            <!-- Cirugías: módulo "Quirófano" (admin, administrador y enf_quirofano por defecto; interruptor por usuario) -->
            <a href="?vista=cirugias" data-vista="cirugias" data-roles="admin,administrador,enf_triage,enf_hospital,enf_quirofano,medico" data-modulo="ver_quirofano" onclick="AdminController.navegar('cirugias', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-kit-medical w-5"></i> Cirugías
            </a>

            <a href="?vista=expedientes" data-vista="expedientes" data-roles="admin,medico" data-modulo="ver_consultas" onclick="AdminController.navegar('expedientes', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-folder-open w-5"></i> Búsqueda Histórica
            </a>

            <!-- EXCLUSIVO ADMIN -->
            <a href="?vista=personal" data-vista="personal" data-roles="admin" onclick="AdminController.navegar('personal', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-users-gear w-5"></i> Gestión de Personal
            </a>

            <a href="#" data-proximamente="Tarifario y Caja" data-roles="admin,administrador" title="El cobro muestra el total sin IVA. El 16% se suma en el desglose solo si el paciente solicita factura." class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-file-invoice-dollar w-5"></i> Tarifario y Caja
            </a>

            <!-- Farmacia: admin, caja y encargado por defecto. Hospital y quirófano solo si Alfonso enciende el módulo. -->
            <a href="?vista=farmacia" data-vista="farmacia" data-roles="admin,administrador,enf_farmacia,enf_hospital,enf_quirofano" data-modulo="ver_farmacia" title="Inventario, cargo sin IVA y bitácora kárdex. El 16% se aplica en Caja solo si solicitan factura." onclick="AdminController.navegar('farmacia', event)" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-xl font-medium transition">
                <i class="fas fa-pills w-5"></i> Farmacia e Inventario
            </a>
        </nav>

        <div class="p-4 border-t border-slate-200/50">
            <button onclick="AdminController.cerrarSesion()" class="flex items-center gap-3 w-full px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl font-medium transition">
                <i class="fas fa-sign-out-alt w-5"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="flex-1 h-full overflow-y-auto custom-scrollbar flex flex-col z-10 relative">
        
        <!-- Topbar Dinámica -->
        <header class="h-20 glass-panel border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-20">
            <h2 class="text-xl font-bold text-slate-800" id="vista-titulo">Panel de Control</h2>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200">
                    <div class="text-right hidden md:block">
                        <!-- Estos spans los llenará JS -->
                        <p class="text-sm font-bold text-slate-800 leading-none" id="user-name">Cargando...</p>
                        <p class="text-xs text-slate-500 mt-1" id="user-role">Cargando...</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor donde se inyectan los módulos (Dashboard, Camas, etc.) -->
        <div id="admin-content" class="p-8">
            <!-- Aquí el JS dibuja el Dashboard Central -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/belen-store.js"></script>
    <script src="js/belen-ui.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/admin-app.js"></script>
</body>
</html>
